name: build

on:
  push:
    branches: [main]
  # Build (but never publish) on PRs.
  pull_request:
    branches: [main]
  # Weekly canary: the pinned inputs (base tag, Miniflux .deb, Tailscale
  # version) must still be fetchable and the image must still boot. Publishes
  # nothing: the VMs patch themselves (unattended-upgrades, Tailscale's
  # auto-update), so a rebuild on the same pins would only move tags.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialise publishes so the newest merge is the one that ends up on latest-*.
# Only PR builds are cancelled: on main, cancelling would abandon a build that
# had already published its immutable <date>.<run>.<attempt>-* tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # A failing flavor must not cancel its sibling mid-push.
      fail-fast: false
      matrix:
        flavor: [exe, tailscale]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: shellcheck upgrade-miniflux

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Only main publishes, and not from the weekly canary.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # exe.dev caches mutable tags, so publish something immutable to pin.
      # run_attempt keeps a re-run from overwriting the tag it is meant to fix.
      - id: tag
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "build=${now%%T*}.${{ github.run_number }}.${{ github.run_attempt }}"
            echo "created=$now"
          } >> "$GITHUB_OUTPUT"

      # Build once into the local image store so the check runs against what
      # gets published; the push step below is then a cache hit.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.flavor }}
          platforms: linux/amd64
          load: true
          tags: exeflux:ci
          provenance: false
          sbom: false

      # machine-id must stay empty (present, or first boot presets units) and
      # dbus's must still be the symlink to it, after our apt layers;
      # svc-miniflux (not miniflux), unattended upgrades and, in the tailscale
      # flavor, tailscaled in userspace mode are enabled; Postgres is socket
      # only with the peer map in place (\x27: a literal quote would end the
      # single-quoted script); svc-miniflux must still be covered by
      # exeslim's svc- hardening drop-in (exposure <= 2.0, where a unit the
      # drop-in misses scores ~9.4); upgrade-miniflux must refuse a downgrade
      # and a malformed checksum before touching anything, each for the right
      # reason.
      - name: Check the image
        run: |
          docker run --rm exeflux:ci bash -euc '
            [[ -f /etc/machine-id && ! -s /etc/machine-id && $(readlink /var/lib/dbus/machine-id) == /etc/machine-id ]]
            [[ $(systemctl is-enabled miniflux.service) == disabled ]]
            systemctl is-enabled svc-miniflux.service
            [[ ${{ matrix.flavor }} != tailscale ]] || systemctl is-enabled tailscaled.service
            [[ ${{ matrix.flavor }} != tailscale ]] || grep -qx "FLAGS=\"--tun=userspace-networking\"" /etc/default/tailscaled
            systemctl is-enabled apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service
            apt-config dump | grep -qx "Unattended-Upgrade::Automatic-Reboot \"true\";"
            ! apt-config dump | grep -q "^APT::Periodic::Enable \"0\";"
            [[ -x /usr/share/update-notifier/notify-reboot-required ]]
            grep -qx RUN_MIGRATIONS=1 /etc/miniflux.conf
            grep -qE "^local +miniflux +miniflux +peer +map=svc$" /etc/postgresql/16/main/pg_hba.conf
            grep -qE "^svc +svc-miniflux +miniflux$" /etc/postgresql/16/main/pg_ident.conf
            grep -qxP "listen_addresses = \x27\x27" /etc/postgresql/16/main/conf.d/10-exeflux-socket-only.conf
            systemd-analyze verify svc-miniflux.service
            systemd-analyze security --offline=true --threshold=20 svc-miniflux.service
            upgrade-miniflux "$(miniflux -version)" 2>&1 | grep -q "is not newer than the installed"
            upgrade-miniflux -s nothex 9.9.9 2>&1 | grep -q "sha256 must be 64 hex digits"'

      # Boot it: after boot only the unit Docker cannot run may have failed,
      # the running svc-miniflux must carry exeslim's hardening drop-in, and
      # it must have migrated and answer. Same recipe as exeslim's own CI.
      # Type=notify: active means Miniflux reported ready, after migrating over
      # the Postgres socket with peer authentication. The running Postgres must
      # have no TCP listener. Then GET /healthcheck the way the proxy does: the
      # port (exe) or the socket (tailscale), which must be the dynamic user's
      # and 0660.
      - name: Boot the image
        run: |
          set -euo pipefail
          docker run -d --name mf --privileged --tmpfs /run --tmpfs /run/lock exeflux:ci
          # "degraded" is expected: systemd-growfs-root fails in Docker.
          timeout 120 bash -c 'until [[ $(docker exec mf systemctl is-system-running 2>/dev/null) =~ ^(running|degraded)$ ]]; do sleep 1; done'
          failed=$(docker exec mf systemctl --failed --plain --no-legend | awk '{print $1}')
          [[ -z $failed || $failed == systemd-growfs-root.service ]] ||
            { echo "unexpected failed units: $failed"; exit 1; }
          dropins=$(docker exec mf systemctl show --property=DropInPaths --value svc-miniflux.service)
          [[ " $dropins " == *" /etc/systemd/system/svc-.service.d/50-hardening.conf "* ]] ||
            { echo "svc-miniflux runs without exeslim's hardening drop-in: $dropins"; exit 1; }
          timeout 120 bash -c 'until [[ $(docker exec mf systemctl is-active svc-miniflux) == active ]]; do sleep 1; done'
          listen=$(docker exec mf runuser -u postgres -- psql -tAc 'SHOW listen_addresses')
          [[ -z $listen ]] || { echo "Postgres listens on TCP: $listen"; exit 1; }
          if [[ ${{ matrix.flavor }} == tailscale ]]; then
            sock=$(docker exec mf stat -c '%U:%G %a' /run/miniflux/miniflux.sock)
            [[ $sock == 'svc-miniflux:svc-miniflux 660' ]] || { echo "socket is wrong: $sock"; exit 1; }
            docker exec mf curl -fsS --unix-socket /run/miniflux/miniflux.sock http://localhost/healthcheck
          else
            docker exec mf curl -fsS http://127.0.0.1:8000/healthcheck
          fi

      - if: failure()
        run: |
          docker exec mf systemctl --failed --no-pager || true
          docker exec mf journalctl -b --no-pager | tail -n 200 || true

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.flavor }}
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
          # Override the source and version labels inherited from exeslim.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.build }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tag.outputs.created }}
          # latest-<flavor> moves; <build-id>-<flavor> is immutable. No <date>
          # or <sha> tags, as in exeslim: they would move while looking like
          # pins. The commit is in the revision label.
          tags: |
            ghcr.io/${{ github.repository }}:latest-${{ matrix.flavor }}
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.build }}-${{ matrix.flavor }}
          # exe.dev reads image metadata directly; attestations would wrap it
          # in a manifest list.
          provenance: false
          sbom: false
