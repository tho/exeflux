name: build

on:
  push:
    branches: [main]
  # Build (but never publish) on PRs.
  pull_request:
    branches: [main]
  # Weekly rebuild picks up Ubuntu security updates to the packages installed
  # here (PostgreSQL, Tailscale's deps). The base is pinned in the Dockerfile.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialise publishes so the newest merge is the one that ends up on latest-*.
# Only PR builds are cancelled: on main, cancelling would abandon a build that
# had already published its immutable <date>.<run>.<attempt>-* tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # A failing flavor must not cancel its sibling mid-push.
      fail-fast: false
      matrix:
        flavor: [exe, tailscale]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: shellcheck upgrade-miniflux

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Only main publishes.
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # exe.dev caches mutable tags, so publish something immutable to pin.
      # run_attempt keeps a re-run from overwriting the tag it is meant to fix.
      - id: tag
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "date=${now%%T*}"
            echo "build=${now%%T*}.${{ github.run_number }}.${{ github.run_attempt }}"
            echo "created=$now"
          } >> "$GITHUB_OUTPUT"

      # Build once into the local image store so the check runs against what
      # gets published; the push step below is then a cache hit.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.flavor }}
          platforms: linux/amd64
          load: true
          tags: exeflux:ci
          provenance: false
          sbom: false

      # machine-id must stay empty (present, or first boot presets units) after
      # our apt layers, svc-miniflux (not miniflux) and unattended upgrades are
      # enabled, and it must still be covered by exeslim's svc- hardening
      # drop-in (exposure <= 2.0).
      - name: Check the image
        run: |
          docker run --rm exeflux:ci bash -euc '
            [[ -f /etc/machine-id && ! -s /etc/machine-id ]]
            [[ $(systemctl is-enabled miniflux.service) == disabled ]]
            systemctl is-enabled svc-miniflux.service
            [[ ${{ matrix.flavor }} != tailscale ]] || systemctl is-enabled tailscaled.service
            systemctl is-enabled apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service
            apt-config dump | grep -qx "Unattended-Upgrade::Automatic-Reboot \"true\";"
            ! apt-config dump | grep -q "^APT::Periodic::Enable \"0\";"
            [[ -x /usr/share/update-notifier/notify-reboot-required ]]
            grep -qx RUN_MIGRATIONS=1 /etc/miniflux.conf
            systemd-analyze verify svc-miniflux.service
            systemd-analyze security --offline=true --threshold=20 svc-miniflux.service
            ! upgrade-miniflux "$(miniflux -version)"'

      # Boot it: Postgres up, svc-miniflux migrated and answering under the
      # effective hardening. Same recipe as exeslim's own CI.
      - name: Boot the image
        run: |
          docker run -d --name mf --privileged --tmpfs /run --tmpfs /run/lock exeflux:ci
          # "degraded" is expected: systemd-growfs-root fails in Docker.
          timeout 120 bash -c 'until [[ $(docker exec mf systemctl is-system-running 2>/dev/null) =~ ^(running|degraded)$ ]]; do sleep 1; done'
          docker exec mf svc-check svc-miniflux.service
          timeout 60 bash -c 'until docker exec mf miniflux -config-file /etc/miniflux.conf -healthcheck auto; do sleep 1; done'

      - if: failure()
        run: |
          docker exec mf systemctl --failed --no-pager || true
          docker exec mf journalctl -b --no-pager | tail -n 200 || true

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.flavor }}
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          # Override the source and version labels inherited from exeslim.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.build }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tag.outputs.created }}
          # Moving:    latest-, <date>-, <sha>-<flavor>
          # Immutable: <date>.<run_number>.<run_attempt>-<flavor>
          tags: |
            ghcr.io/${{ github.repository }}:latest-${{ matrix.flavor }}
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.date }}-${{ matrix.flavor }}
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.build }}-${{ matrix.flavor }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ matrix.flavor }}
          # exe.dev reads image metadata directly; attestations would wrap it
          # in a manifest list.
          provenance: false
          sbom: false
